services:
  postgres:
    image: postgres:18
    container_name: nx_postgres
    restart: 'no'
    environment:
      POSTGRES_USER: nxuser
      POSTGRES_PASSWORD: nxpass
      POSTGRES_DB: nxdb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis/redis-stack-server:latest
    container_name: nx_redis
    restart: 'no'
    ports:
      - '6379:6379'

volumes:
  postgres_data:
